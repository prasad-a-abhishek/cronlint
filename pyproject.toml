[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cronlint-cli"
version = "0.1.0"
description = "Validate cron expressions from the CLI or as a Python library."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "repo-builder"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
# Intentionally zero runtime dependencies — the spec does not require any.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
cronlint = "cronlint.cli:main"

[project.urls]
Homepage = "https://github.com/prasad-a-abhishek/cronlint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"